<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>AdBlocker</title>
  <style>
    body {
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
      margin: 0;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #ccc;
      border-radius: 24px;
      transition: 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.2s;
    }
    input:checked + .slider {
      background-color: #4CAF50;
    }
    input:checked + .slider::before {
      transform: translateX(20px);
    }
    .count {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin: 8px 0;
    }
    .label {
      font-size: 12px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>AdBlocker</h1>
  <div class="status">
    <span id="statusText">Aktiv</span>
    <label class="toggle">
      <input type="checkbox" id="toggleSwitch" checked />
      <span class="slider"></span>
    </label>
  </div>
  <div class="count" id="adCount">0</div>
  <div class="label">Elemente auf dieser Seite blockiert</div>

  <script src="popup.js"></script>
</body>
</html>
